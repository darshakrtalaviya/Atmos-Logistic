      (function() {
        // Global error suppression for external chrome-extension injected scripts
        window.addEventListener('error', function(event) {
          try {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            var fn = (event && event.filename) || '';
            if (fn.indexOf('chrome-extension://') !== -1 || msg.indexOf('Cannot set property fetch') !== -1) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          } catch (e) {}
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = String(event && event.reason);
            if (reason.indexOf('chrome-extension://') !== -1 || reason.indexOf('Cannot set property fetch') !== -1) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
            }
          } catch (e) {}
        }, true);

        // Define configurable getter and setter for fetch on window and Window.prototype
        try {
          var _currentFetch = window.fetch;
          var desc = {
            get: function() { return _currentFetch; },
            set: function(fn) { _currentFetch = fn; },
            configurable: true,
            enumerable: true
          };
          try { Object.defineProperty(window, 'fetch', desc); } catch (e1) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            }
          } catch (e2) {}
        } catch (e) {}
      })();
